<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anees flashcards</title>
<style>
:root{--bg:#F4F6F2;--bg2:#fff;--ink:#1B2620;--mute:#5B6A62;--line:#D6DDD8;--teal:#0F6E56;--amber:#B26F0E;--red:#B23A2E;--ice:#4F7FC4}
@media(prefers-color-scheme:dark){:root{--bg:#0F1613;--bg2:#17211C;--ink:#E7EDE9;--mute:#9BAAA2;--line:#2A3630;--teal:#4FC4A2;--amber:#E7A93B;--red:#E77A6E;--ice:#8FB4F0}}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-wrap:anywhere}
main{max-width:560px;margin:0 auto;padding:12px;min-height:100vh;display:flex;flex-direction:column}
h1{font-size:22px;margin:6px 0} h2{font-size:16px;color:var(--mute);margin:14px 0 6px;font-weight:600} .mute{color:var(--mute);font-size:14px}
button{min-height:48px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:14px;font:600 17px system-ui;padding:8px 14px;cursor:pointer}
button.primary{background:var(--teal);color:#fff;border-color:var(--teal)} button.bad{background:var(--red);color:#fff;border-color:var(--red)} button.sel{outline:3px solid var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:8px} .chips button{font-size:15px;min-height:44px} .chips small{color:inherit;opacity:.7;font-weight:400}
.row{display:flex;gap:10px;align-items:center;margin:10px 0} .row button{flex:1}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0} .bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .2s}
.scene{perspective:1200px;flex:1;display:flex;align-items:stretch;min-height:300px}
.card{position:relative;width:100%;min-height:300px;transform-style:preserve-3d;transition:transform .35s;cursor:pointer;border-radius:20px}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--bg2);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.face.back{transform:rotateY(180deg)} .big{font-size:34px;font-weight:700;line-height:1.2} .ar{font-size:30px;direction:rtl;margin-top:8px} .en{font-size:22px} .hint{color:var(--mute);font-size:13px;position:absolute;bottom:12px}
.badge{position:absolute;top:12px;left:12px;font:600 12px system-ui;padding:3px 9px;border-radius:999px;color:#fff;background:var(--mute)}
.b-missed{background:var(--red)} .b-shaky{background:var(--amber)} .b-cold{background:var(--teal)} .b-ice_cold{background:var(--ice)} .b-never{background:var(--mute)}
.topic{position:absolute;top:12px;right:12px;font-size:12px;color:var(--mute)}
.summary{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px;margin:8px 0} .num{font-size:30px;font-weight:700}
.sync{font-size:12px;color:var(--mute);margin-top:auto;padding-top:10px} .toggle{display:flex;gap:8px} .toggle button{flex:1;min-height:44px;font-size:15px}
</style></head><body><main>
<div id="root"><p class="mute">Loading words…</p></div>
<p class="sync" id="sync"></p>
</main>
<script src="js/config.js"></script><script src="js/buckets.js"></script><script src="js/cards-core.js"></script>
<script>
const C=window.AneesCards, root=document.getElementById('root'), syncEl=document.getElementById('sync');
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const uuid=()=> (crypto.randomUUID? crypto.randomUUID() : 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2));
const LS=(k,v)=>{ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||'null'); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } };
let words=[], stats={}, pref=LS('anees-cards-pref')||{mode:'ar_first',shuffle:true,n:20,subject:'b-missed'};
const H={apikey:ANEES.anon,Authorization:'Bearer '+ANEES.anon,'Content-Type':'application/json'};
async function load(){
  try{ let all=[], off=0; while(true){ const r=await fetch(ANEES.url+'/rest/v1/words?select=key,arabizi,arabic,english,plural,topic,subtopic,doc_order&active=eq.true&order=doc_order&limit=1000&offset='+off,{headers:H}); if(!r.ok) break; const part=await r.json(); all=all.concat(part); if(part.length<1000) break; off+=1000; } if(all.length){ words=all; LS('anees-words',words); } }catch(e){}
  if(!words.length){ words=LS('anees-words')||[]; if(!words.length){ try{ const r=await fetch('data/words.json'); words=(await r.json()).items; }catch(e){} } if(words.length) syncEl.textContent='Offline: using the saved word list.'; }
  try{ const r=await fetch(ANEES.url+'/rest/v1/word_stats?select=word_key,bucket,recent,weight,last_reviewed,times_missed&limit=5000',{headers:H}); if(r.ok){ for(const s of await r.json()) stats[s.word_key]=s; LS('anees-stats',stats); } }catch(e){}
  if(!Object.keys(stats).length) stats=LS('anees-stats')||{};
  applyLocalResults();
}
// local results (not yet synced, or synced today) keep the buckets fresh between server recomputes
function applyLocalResults(){ const q=LS('anees-card-log')||[]; if(!q.length) return; const by={}; for(const r of q)(by[r.word_key]=by[r.word_key]||[]).push(r);
  for(const k in by){ const [b]=AneesBuckets.signalFromCards(by[k].sort((a,c)=>a.ts.localeCompare(c.ts))); if(b) stats[k]={...(stats[k]||{word_key:k}),bucket:b,weight:(b==='missed'||(stats[k]&&stats[k].recent))?3:1,last_reviewed:by[k][by[k].length-1].ts}; } }
// ---- offline queue -> Supabase (id = idempotency key; duplicates ignored server-side) ----
function enqueue(row){ const q=LS('anees-card-queue')||[]; q.push(row); LS('anees-card-queue',q); const log=LS('anees-card-log')||[]; log.push(row); LS('anees-card-log',log.slice(-2000)); sync(); }
let syncing=false, again=false;
async function sync(){ if(syncing){ again=true; return; } syncing=true;
  try{ while(true){ const q=LS('anees-card-queue')||[]; if(!q.length) break; const batch=q.slice(0,50);
    const r=await fetch(ANEES.url+'/rest/v1/card_results?on_conflict=id',{method:'POST',headers:{...H,Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify(batch)});
    if(!r.ok) throw new Error('sync '+r.status);
    const sent=new Set(batch.map(x=>x.id)); LS('anees-card-queue',(LS('anees-card-queue')||[]).filter(x=>!sent.has(x.id)));   // never drop rows queued meanwhile
  } syncEl.textContent='All answers saved.'; }
  catch(e){ const n=(LS('anees-card-queue')||[]).length; syncEl.textContent=`${n} answer${n===1?'':'s'} waiting to sync (offline is fine).`; }
  syncing=false; if(again){ again=false; sync(); } }
window.addEventListener('online',sync); setInterval(()=>{ if((LS('anees-card-queue')||[]).length) sync(); },5000);
async function flag(word){ try{ await fetch(ANEES.url+'/rest/v1/amal_rules',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({source:'flashcards',kind:'flag',word_key:word.key,payload:{arabizi:word.arabizi,why:'often wrong on flashcards'}})}); }catch(e){} }
// ---- UI ----
let round=null, flipped=false, sessionMissed={};
function picker(){
  const S=C.subjects(words,stats); const chip=(s)=>`<button data-s="${esc(s.id)}" class="${pref.subject===s.id?'sel':''}">${esc(s.name)} <small>${s.n}</small></button>`;
  root.innerHTML=`<h1>Flashcards</h1><p class="mute">Tap a card to flip. Got it or Missed. Wrong cards come back until the pile is empty.</p>
    <h2>Buckets</h2><div class="chips">${S.buckets.map(chip).join('')}</div>
    <h2>Grammar sets</h2><div class="chips">${S.grammar.map(chip).join('')}</div>
    <h2>Topics from Amal's Doc</h2><div class="chips">${S.topics.map(chip).join('')}</div>
    <h2>Options</h2><div class="toggle"><button id="m-ar" class="${pref.mode==='ar_first'?'sel':''}">Arabic first</button><button id="m-en" class="${pref.mode==='en_first'?'sel':''}">English first</button></div>
    <div class="toggle" style="margin-top:8px"><button id="sh" class="${pref.shuffle?'sel':''}">Shuffle ${pref.shuffle?'on':'off'}</button><button id="n20" class="${pref.n===20?'sel':''}">20 cards</button><button id="n10" class="${pref.n===10?'sel':''}">10 cards</button></div>
    <div class="row" style="margin-top:14px"><button id="start" class="primary">Start</button></div>`;
  root.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{pref.subject=b.dataset.s; LS('anees-cards-pref',pref); picker();});
  document.getElementById('m-ar').onclick=()=>{pref.mode='ar_first'; LS('anees-cards-pref',pref); picker();};
  document.getElementById('m-en').onclick=()=>{pref.mode='en_first'; LS('anees-cards-pref',pref); picker();};
  document.getElementById('sh').onclick=()=>{pref.shuffle=!pref.shuffle; LS('anees-cards-pref',pref); picker();};
  document.getElementById('n20').onclick=()=>{pref.n=20; LS('anees-cards-pref',pref); picker();};
  document.getElementById('n10').onclick=()=>{pref.n=10; LS('anees-cards-pref',pref); picker();};
  document.getElementById('start').onclick=start;
}
function start(){ let p=C.pool(words,stats,pref.subject); if(!p.length){ alert('No words in this set yet.'); return; }
  let cards=C.draw(p,stats,Math.min(pref.n,p.length)); if(!pref.shuffle) cards=cards.slice().sort((a,b)=>(a.doc_order||0)-(b.doc_order||0));
  round=C.newRound(cards,{mode:pref.mode,subject:pref.subject}); sessionMissed={}; showCard(); }
function showCard(){ flipped=false; if(C.done(round)) return showSummary();
  const w=round.cards[round.i], s=stats[w.key]||{bucket:'never'}; const front=pref.mode==='ar_first', pct=Math.round(100*round.i/round.cards.length);
  const arFace=`<div class="big">${esc(w.arabizi)}</div><div class="ar">${esc(w.arabic)}</div>`, enFace=`<div class="en">${esc(w.english)}</div>`;
  root.innerHTML=`<div class="row"><button id="back" style="flex:0 0 auto">‹ Sets</button><div style="flex:1"><div class="mute">${round.attempt>1?'Review round '+round.attempt+' · ':''}${round.i+1} of ${round.cards.length}</div><div class="bar"><i style="width:${pct}%"></i></div></div></div>
    <div class="scene"><div class="card" id="card"><div class="face"><span class="badge b-${esc(s.bucket)}">${esc(String(s.bucket).replace('_',' '))}</span><span class="topic">${esc(w.topic)}</span>${front?arFace:enFace}<span class="hint">tap to flip</span></div>
    <div class="face back"><span class="badge b-${esc(s.bucket)}">${esc(String(s.bucket).replace('_',' '))}</span>${front?enFace:arFace}<span class="hint">${esc(w.subtopic)}</span></div></div></div>
    <div class="row"><button id="miss" class="bad">Missed</button><button id="got" class="primary">Got it</button></div>`;
  const card=document.getElementById('card'); card.onclick=()=>{flipped=!flipped; card.classList.toggle('flip',flipped);};
  let x0=null; card.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;},{passive:true}); card.addEventListener('touchend',e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; x0=null; if(dx>70) answer('got'); else if(dx<-70) answer('missed'); });
  document.getElementById('got').onclick=()=>answer('got'); document.getElementById('miss').onclick=()=>answer('missed'); document.getElementById('back').onclick=picker;
  document.onkeydown=e=>{ if(e.key===' '){card.click();} if(e.key==='ArrowRight') answer('got'); if(e.key==='ArrowLeft') answer('missed'); };
}
function answer(result){ const w=round.cards[round.i]; const row=C.answer(round,result,new Date().toISOString(),uuid()); if(!row) return; enqueue(row);
  const hist=(LS('anees-card-log')||[]).filter(r=>r.word_key===w.key).sort((a,b)=>a.ts.localeCompare(b.ts)); const [b]=AneesBuckets.signalFromCards(hist); stats[w.key]={...(stats[w.key]||{word_key:w.key}),bucket:b,last_reviewed:row.ts};
  if(result==='missed'){ sessionMissed[w.key]=(sessionMissed[w.key]||0)+1; if(sessionMissed[w.key]===2) flag(w); }
  showCard(); }
function showSummary(){ const s=C.summary(round); document.onkeydown=null;
  root.innerHTML=`<h1>${round.attempt>1?'Review round '+round.attempt:'Round'} done</h1>
    <div class="summary"><div class="num">${s.got} <span class="mute" style="font-size:16px">got</span> · ${s.missed} <span class="mute" style="font-size:16px">missed</span></div><div class="mute">${s.n} cards · ${esc(round.subject)} · ${pref.mode==='ar_first'?'Arabic first':'English first'}</div>
    ${s.history.map(h=>`<div class="mute">round ${h.attempt}: ${h.got}/${h.n} got</div>`).join('')}</div>
    <div class="row">${s.wrong.length?`<button id="replay" class="primary">Review the ones I got wrong (${s.wrong.length})</button>`:`<button id="again" class="primary">Pile empty — new round</button>`}</div>
    <div class="row"><button id="back">‹ Sets</button></div><p class="mute" id="wrongs">${s.wrong.length?'Still wrong: '+s.wrong.map(k=>esc((words.find(w=>w.key===k)||{}).arabizi||k)).join(', '):''}</p>`;
  const rp=document.getElementById('replay'); if(rp) rp.onclick=()=>{ round=C.replayWrong(round); showCard(); };
  const ag=document.getElementById('again'); if(ag) ag.onclick=start; document.getElementById('back').onclick=picker; }
window.AneesTest={ get round(){return round;}, get stats(){return stats;}, get words(){return words;}, answer, start, picker, sync, pref };
load().then(picker);
</script></body></html>
