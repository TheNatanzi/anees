<title>Amal · Listening check</title><script src="../js/theme.js"></script><link rel="stylesheet" href="../css/sabz-tokens.css"><link rel="stylesheet" href="../css/word-bank.css?v=menu1"><link rel="stylesheet" href="../css/vocabulary-progress.css"><link rel="stylesheet" href="../css/tutor-hub.css?v=20261002-done2">

<!-- Amal's listening / checking lists (Medi 2026-10-05): amal/check.html?list=<name>&t=<her link token>. One page for every
     list in data/amal-checks.json; the same module the Tutor hub opens in its panel (docs/js/hub/check-task.js), the same
     shell, saving and Undo (AM-17) as her other pages. -->
<script src="../js/config.js"></script><script src="../js/clip-fallback.js?v=1"></script><script src="../js/amal-undo.js?v=20261002-1"></script><script src="../js/play-bar.js?v=20261002-1" data-apb></script><script src="../js/hub/clip-player.js?v=20261002-2"></script>
<script src="../js/hub/solo.js?v=20261002-1"></script><script src="../js/hub/check-task.js?v=20261005-1"></script>
<script>(async () => {
  const list = (new URLSearchParams(location.search).get('list') || '').replace(/[^a-z0-9-]/g, '');
  let D = null;
  try { const r = await fetch('../data/amal-check-' + list + '.json', { cache: 'no-store' }); if (list && r.ok) D = await r.json(); } catch (e) {}
  if (D) document.title = 'Amal · ' + D.title;
  AneesSolo.run({ title: D ? D.title : 'Listening check', who: D ? D.intro : '', noToken: true,
    mount: (el, it) => { if (D) AneesCheckTask.mount(el, { token: it.token, base: it.base, list, data: D }); else el.innerHTML = '<p class="hb-sub">This page needs the link Medi sent you.</p>'; } });
})();</script>
</body></html>
