<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>After the lesson</title>
<style>
:root{--bg:#F4F6F2;--bg2:#fff;--ink:#1B2620;--mute:#5B6A62;--line:#D6DDD8;--teal:#0F6E56;--amber:#B26F0E;--red:#B23A2E}
@media(prefers-color-scheme:dark){:root{--bg:#0F1613;--bg2:#17211C;--ink:#E7EDE9;--mute:#9BAAA2;--line:#2A3630;--teal:#4FC4A2;--amber:#E7A93B;--red:#E77A6E}}
*{box-sizing:border-box} html,body{height:100%} body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-wrap:anywhere}
main{max-width:520px;margin:0 auto;padding:14px 14px 24px;min-height:100%;display:flex;flex-direction:column}
.who{font-size:14px;color:var(--mute);margin:0 0 6px} .prog{font-size:13px;color:var(--teal);font-weight:700;letter-spacing:.04em;margin:0 0 4px}
h1{font-size:23px;margin:2px 0 8px;line-height:1.25} .sug{font-size:14px;color:var(--mute);margin:0 0 10px}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:6px}
button{min-height:52px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:14px;font:600 18px system-ui;padding:10px 14px;text-align:left;cursor:pointer;width:100%}
button.primary{background:var(--teal);color:#fff;border-color:var(--teal)} button.drop{color:var(--red)} button.play{background:var(--amber);color:#fff;border-color:var(--amber);text-align:center;font-size:20px}
button.play.on{background:var(--teal);border-color:var(--teal)} button small{display:block;font:14px system-ui;color:var(--mute);font-weight:400}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:4px 0 10px} .card .big{font-size:22px;font-weight:700}
.ar{font-size:17px;color:var(--mute);direction:rtl;display:block} .en{color:var(--mute);font-size:15px;margin-top:2px} .why{font-size:13px;color:var(--amber);margin-top:6px}
input{width:100%;font:18px system-ui;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);color:var(--ink);margin-top:8px}
.skip{display:block;min-height:44px;padding:12px 4px;margin-top:6px;color:var(--mute);font-size:15px;text-align:center}
.quit{margin-top:auto;padding-top:12px;font-size:14px;color:var(--mute)} .quit a{color:var(--mute);display:inline-block;padding:12px 4px;min-height:44px}
</style></head><body><main>
<p class="who" id="who">Medi's app has a few quick questions about today's lesson. Tap ▶ once to hear the moment.</p>
<p class="prog" id="prog"></p>
<div id="root"><p class="sug">Loading…</p></div>
<audio id="player" preload="none"></audio>
<p class="quit" id="quit"><a href="#" id="quitlink">Stop here</a> · saved as you tap · under 5 minutes</p>
</main>
<script src="../js/config.js"></script>
<script>
const qs=new URLSearchParams(location.search), TOKEN=qs.get('t')||'';
const H={apikey:ANEES.anon,Authorization:'Bearer '+ANEES.anon,'Content-Type':'application/json','X-Anees-Token':TOKEN};
const api=(m,p,b,extra)=>fetch(ANEES.url+'/rest/v1/'+p,{method:m,headers:{...H,...(extra||{})},body:b?JSON.stringify(b):undefined});
const root=document.getElementById('root'), prog=document.getElementById('prog'), who=document.getElementById('who'), player=document.getElementById('player');
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
let link=null, answers={}, step=0, screens=[];
// Durable autosave: every tap is written to localStorage first (queue + answers, keyed by this link), then sent; a reload
// resumes at the first unanswered screen and re-sends anything still queued. Nothing is lost on a dropped network.
const QK='anees-amal-q-'+TOKEN, AK='anees-amal-a-'+TOKEN;
const LS=(k,v)=>{ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||'null'); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } };
let flushing=false, pendingDone=false;
async function flush(){ if(flushing) return; flushing=true;
  while(true){ const q=LS(QK)||[]; if(!q.length) break; const job=q[0]; let ok=false;
    try{ let r;
      if(job.kind==='rule') r=await api('POST','amal_rules',job.body,{Prefer:'return=minimal'});
      else if(job.kind==='item') r=await api('PATCH','homework_items?id=eq.'+encodeURIComponent(job.id_item),job.body,{Prefer:'return=minimal'});        // M10c: keep / drop / edit a prompt
      else if(job.kind==='item_new') r=await api('POST','homework_items',job.body,{Prefer:'return=minimal'});                                            // M10c: her own line
      else if(job.kind==='verdict') r=await api('PATCH','homework_answers?id=eq.'+encodeURIComponent(job.id_answer),job.body,{Prefer:'return=minimal'});  // M10c: her verdict on Medi's answer
      else r=await api('PATCH','amal_links?token=eq.'+encodeURIComponent(TOKEN),job.body,{Prefer:'return=minimal'});
      ok=r.ok||r.status===409; }catch(e){ ok=false; }
    if(!ok){ await new Promise(r=>setTimeout(r,2000)); continue; }
    const q2=LS(QK)||[]; LS(QK,q2.filter(x=>x.id!==job.id)); }
  flushing=false; if(pendingDone && !(LS(QK)||[]).length){ pendingDone=false; showDone(); } }
setInterval(()=>{ if((LS(QK)||[]).length) flush(); },3000); window.addEventListener('online',flush);
function push(kind,body,extra){ const q=LS(QK)||[]; q.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),kind,body,...(extra||{})}); LS(QK,q); flush(); }
function rule(kind,word_key,payload){ push('rule',{token:TOKEN,source:'after',lesson_date:link.lesson_date,kind,word_key,payload}); }
function save(done){ answers.updated=new Date().toISOString(); LS(AK,answers); const body={answers}; if(done) body.done_at=answers.updated; if(!link.opened_at) body.opened_at=answers.updated; push('link',body); }
function show(i){ step=i; answers.step=i; LS(AK,answers); player.pause(); const s=screens[i]; if(!s){ finish(); return; } prog.textContent=s.prog; root.innerHTML=s.html; s.wire&&s.wire(); window.scrollTo(0,0); }
function next(){ show(step+1); }
function showDone(){ prog.textContent='Done'; who.textContent='Thank you, Amal.'; root.innerHTML='<h1>All saved. Shukran!</h1><p class="sug">The app suggested; you decided.</p>'; document.getElementById('quit').style.display='none'; }
function finish(){ answers.done=true; save(true); prog.textContent='Saving…'; root.innerHTML='<h1>Saving your answers…</h1><p class="sug">One moment. If you are offline this finishes by itself when you are back online.</p>'; document.getElementById('quit').style.display='none';
  if(!(LS(QK)||[]).length) showDone(); else { pendingDone=true; flush(); } }
function playBtn(id,clip,off){ return `<button id="${id}" class="play" data-clip="${esc(clip)}" data-off="${off}">▶ Play the moment</button>`; }
function wirePlay(id){ const b=document.getElementById(id); if(!b) return; b.onclick=()=>{ const src=ANEES.pages+'lessons/'+b.dataset.clip; if(!player.src.endsWith(b.dataset.clip)) player.src=src; player.currentTime=0; player.play(); b.classList.add('on'); b.textContent='▶ Playing…'; };
  player.onended=()=>{ b.classList.remove('on'); b.textContent='▶ Play again'; }; }
function build(p){
  const S=[]; const Q=p.questions||[], HW=p.homework||[], PR=p.prompts||[], PEND=p.pending||[]; const total=Q.length+HW.length+PEND.length+PR.length+(PR.length?1:0);
  who.textContent=`Medi's app has ${Q.length} quick question${Q.length===1?'':'s'} about today's lesson${(HW.length||PR.length)?' and suggests homework':''}${PEND.length?` · ${PEND.length} typed answer${PEND.length===1?'':'s'} from Medi to check`:''}. Tap ▶ once to hear the moment.`;
  Q.forEach((q,i)=>{ const id=`q${i}`;
    const kinds={'Right':'right','Wrong':'wrong','Wrong word':'wrong','Wrong grammar':'wrong','Not Medi':'not_medi','Skip':'skip','Medi, right':'right','Medi, wrong':'wrong','Yes, a word':'alias','No':'no'};
    const missKind={'Wrong word':'word','Wrong grammar':'grammar'};
    S.push({prog:`${i+1} of ${total}`,html:`<h1>${esc(q.ask)}</h1><p class="sug">${esc(q.why)}. Your answer changes how the app scores this word.</p>
      <div class="card">${q.arabizi?`<div class="big">${esc(q.arabizi)}</div>`:''}<span class="ar">${esc(q.arabic||'')}</span><div class="en">${esc(q.english||'')}</div></div>
      ${playBtn(id+'p',q.clip,q.offset)}${q.typed?`<input id="${id}t" placeholder="her spelling (optional)" aria-label="spelling">`:''}<div class="btns">${q.buttons.slice(0,3).map((b,j)=>`<button id="${id}b${j}">${esc(b)}</button>`).join('')}</div><a href="#" id="${id}skip" class="skip">Skip this one</a>`,
      wire(){ wirePlay(id+'p');
        const answer=(label)=>{ const kind=kinds[label]||'skip'; const typed=document.getElementById(id+'t'); const pl={t:q.t,ask:q.ask,label,clip:q.clip,arabic:q.arabic,arabizi:q.arabizi};
          if(typed&&typed.value.trim()) pl.alias=typed.value.trim(); if(missKind[label]) pl.miss_kind=missKind[label]; if(q.who) pl.who=true;
          (answers.q=answers.q||{})[i]=label; rule(kind,q.word_key,pl); save(); next(); };
        q.buttons.slice(0,3).forEach((b,j)=>document.getElementById(id+'b'+j).onclick=()=>answer(b));
        document.getElementById(id+'skip').onclick=e=>{e.preventDefault(); answer('Skip');}; }});
  });
  HW.forEach((h,i)=>{ const id=`h${i}`;
    S.push({prog:`${Q.length+i+1} of ${total}`,html:`<h1>Homework suggestion ${i+1} of ${HW.length}</h1><p class="sug">The app suggests this for Medi (${esc(h.kind==='say'?'a sentence to say':h.kind==='use'?'a word to use':'a mini-dialogue')}). Keep, drop or edit it.</p>
      <div class="card"><div class="big">${esc(h.arabizi)}</div><span class="ar">${esc(h.arabic||'')}</span><div class="en">${esc(h.english||'')}</div>${h.note?`<div class="why">${esc(h.note)}</div>`:''}</div>
      <div class="btns"><button id="${id}k" class="primary">Keep</button><button id="${id}d" class="drop">Drop</button><button id="${id}e">Edit</button></div>
      <div id="${id}box" style="display:none"><input id="${id}v" value="${esc(h.arabizi)}" aria-label="edited"><button id="${id}g" class="primary" style="margin-top:8px">Save my version</button></div>`,
      wire(){ const pl={arabizi:h.arabizi,arabic:h.arabic,english:h.english,keys:h.keys,kind:h.kind};
        document.getElementById(id+'k').onclick=()=>{(answers.hw=answers.hw||{})[i]='keep'; rule('keep',null,{...pl,source:'homework'}); save(); next();};
        document.getElementById(id+'d').onclick=()=>{(answers.hw=answers.hw||{})[i]='drop'; rule('drop',null,{...pl,source:'homework'}); (h.keys||[]).forEach(k=>rule('drop',k,{homework:h.arabizi})); save(); next();};
        document.getElementById(id+'e').onclick=()=>{document.getElementById(id+'box').style.display='block';};
        document.getElementById(id+'g').onclick=()=>{const v=document.getElementById(id+'v').value.trim(); if(!v) return; (answers.hw=answers.hw||{})[i]='edit'; rule('edit',null,{...pl,edited:v,source:'homework'}); save(); next();}; }});
  });
  // M10c (Medi 2026-09-05): Medi's typed answers to the last sheet - her verdict is the one that scores the word
  PEND.forEach((a,i)=>{ const id=`v${i}`; const it=a.homework_items||{}; const g=a.grade||{}; const en=(it.status==='edit'||it.status==='amal')&&it.edited_english?it.edited_english:(it.english||'');
    const gtxt=g.verdict?`The app said: <b>${esc(g.verdict==='right'?'right':g.verdict==='close'?'close':g.verdict==='wrong'?'not right':'ungraded')}</b>${(g.notes||[]).length?' · '+esc((g.notes||[]).map(n=>n.say).join(' · ')):''}${g.fixed&&g.verdict!=='right'?' → '+esc(g.fixed):''}`:'The app has not graded this one.';
    S.push({prog:`${Q.length+HW.length+i+1} of ${total}`,html:`<h1>Medi typed this answer. Is it right?</h1><p class="sug">You have the final word; the app only suggested. Your answer scores the words.</p>
      <div class="card"><div class="en">${esc(en)}</div><div class="big">${esc(a.answer)}</div><div class="why">${gtxt}</div></div>
      <div class="btns"><button id="${id}r" class="primary">Correct</button><button id="${id}f">Needs a fix</button><button id="${id}s">Skip</button></div>
      <div id="${id}box" style="display:none"><input id="${id}v" value="${esc(g.fixed&&g.verdict!=='right'?g.fixed:a.answer)}" aria-label="your fix"><button id="${id}g" class="primary" style="margin-top:8px">Save my fix</button></div>`,
      wire(){ const done=(verdict,fix)=>{ (answers.v=answers.v||{})[a.id]=verdict; const body={amal_verdict:verdict,amal_at:new Date().toISOString()}; if(fix) body.amal_fix=fix; push('verdict',body,{id_answer:a.id}); save(); next(); };
        document.getElementById(id+'r').onclick=()=>done('right'); document.getElementById(id+'s').onclick=()=>done('skip');
        document.getElementById(id+'f').onclick=()=>{document.getElementById(id+'box').style.display='block';};
        document.getElementById(id+'g').onclick=()=>{const v=document.getElementById(id+'v').value.trim(); if(!v) return; done('fix',v);}; }});
  });
  // M10c: tonight's prompt lines - the app suggests, Amal decides (keep / drop / edit), then may add her own
  PR.forEach((it,i)=>{ const id=`p${i}`;
    S.push({prog:`${Q.length+HW.length+PEND.length+i+1} of ${total}`,html:`<h1>Homework line ${i+1} of ${PR.length}</h1><p class="sug">The app suggests this English line for Medi to say in Arabic (it practises ${esc((it.keys||[]).length)} of his words). Keep, drop or edit it.</p>
      <div class="card"><div class="big">${esc(it.english)}</div></div>
      <div class="btns"><button id="${id}k" class="primary">Keep</button><button id="${id}d" class="drop">Drop</button><button id="${id}e">Edit</button></div>
      <div id="${id}box" style="display:none"><input id="${id}v" value="${esc(it.english)}" aria-label="edited line"><button id="${id}g" class="primary" style="margin-top:8px">Save my version</button></div>`,
      wire(){ const decide=(status,edited)=>{ (answers.pr=answers.pr||{})[it.id]=status; const body={status,decided_at:new Date().toISOString()}; if(edited) body.edited_english=edited;
          push('item',body,{id_item:it.id}); rule(status,null,{english:it.english,edited,keys:it.keys,source:'homework_prompt'}); save(); next(); };
        document.getElementById(id+'k').onclick=()=>decide('keep'); document.getElementById(id+'d').onclick=()=>decide('drop');
        document.getElementById(id+'e').onclick=()=>{document.getElementById(id+'box').style.display='block';};
        document.getElementById(id+'g').onclick=()=>{const v=document.getElementById(id+'v').value.trim(); if(!v) return; decide('edit',v);}; }});
  });
  if(PR.length){ const id='own';
    S.push({prog:`${total} of ${total}`,html:`<h1>Your own lines?</h1><p class="sug">The app suggested its lines; now yours. Type any English line you want Medi to say in Arabic, one at a time, as many as you like.</p>
      <input id="${id}v" placeholder="e.g. Did you call your brother yesterday?" aria-label="your line"><div class="btns"><button id="${id}a">Add this line</button><button id="${id}n" class="primary">No more lines, finish</button></div><p class="sug" id="${id}c"></p>`,
      wire(){ let n=0; const inp=document.getElementById(id+'v');
        document.getElementById(id+'a').onclick=()=>{ const v=inp.value.trim(); if(!v) return; n++; push('item_new',{lesson_date:link.lesson_date,token:TOKEN,n:100+n,english:v,edited_english:v,status:'amal',keys:[]}); rule('keep',null,{english:v,source:'homework_prompt',own:true}); inp.value=''; document.getElementById(id+'c').textContent=`${n} line${n===1?'':'s'} added. Add another or finish.`; save(); };
        document.getElementById(id+'n').onclick=()=>{ next(); }; }});
  }
  return S;
}
document.getElementById('quitlink').onclick=e=>{e.preventDefault(); finish();};
(async()=>{
  if(!TOKEN){ root.innerHTML='<h1>This link is missing its code.</h1>'; return; }
  let rows=[]; try{ rows=await (await api('GET','amal_links?select=*&token=eq.'+encodeURIComponent(TOKEN))).json(); }catch(e){}
  link=Array.isArray(rows)?rows[0]:null;
  if(!link){ root.innerHTML='<h1>This link is not valid any more.</h1><p class="sug">Links work for 7 days. Ask Medi for a fresh one.</p>'; prog.textContent=''; return; }
  if(new Date(link.expires_at)<new Date()){ root.innerHTML='<h1>This link has expired.</h1><p class="sug">Links work for 7 days. Ask Medi for a fresh one.</p>'; prog.textContent=''; return; }
  if(link.done_at){ root.innerHTML='<h1>Already done, thank you Amal.</h1><p class="sug">Your answers are saved. Nothing else to do.</p>'; prog.textContent='Done'; document.getElementById('quit').style.display='none'; return; }
  const payload=Object.assign({}, link.payload||{});
  try{ const pend=await (await api('GET','homework_answers?select=id,answer,grade,item_id,lesson_date,homework_items(english,edited_english,status,n,lesson_date)&amal_verdict=is.null&lesson_date=lte.'+encodeURIComponent(link.lesson_date)+'&order=ts.asc&limit=20')).json();
    payload.pending=Array.isArray(pend)?pend.filter(a=>!((LS(AK)||{}).v||{})[a.id]):[]; }catch(e){ payload.pending=[]; }   // M10c: Medi's typed answers waiting for her verdict
  answers=Object.assign({}, link.answers||{}, LS(AK)||{}); screens=build(payload);
  if(answers.done){ finish(); return; }
  show(typeof answers.step==='number' ? Math.min(answers.step, screens.length) : 0); flush(); save();
})();
</script><script src="../js/build.js"></script><script src="../js/stale.js"></script></body></html>
