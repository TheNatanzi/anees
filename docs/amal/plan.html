<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Before today's lesson</title>
<style>
:root{--bg:#F4F6F2;--bg2:#fff;--ink:#1B2620;--mute:#5B6A62;--line:#D6DDD8;--teal:#0F6E56;--amber:#B26F0E;--red:#B23A2E}
@media(prefers-color-scheme:dark){:root{--bg:#0F1613;--bg2:#17211C;--ink:#E7EDE9;--mute:#9BAAA2;--line:#2A3630;--teal:#4FC4A2;--amber:#E7A93B;--red:#E77A6E}}
*{box-sizing:border-box} html,body{height:100%} body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-wrap:anywhere}
main{max-width:520px;margin:0 auto;padding:14px 14px 24px;min-height:100%;display:flex;flex-direction:column}
.who{font-size:14px;color:var(--mute);margin:0 0 6px} .prog{font-size:13px;color:var(--teal);font-weight:700;letter-spacing:.04em;margin:0 0 4px}
h1{font-size:24px;margin:2px 0 10px;line-height:1.25} .sug{font-size:14px;color:var(--mute);margin:0 0 12px}
.screen{display:none;flex:1;flex-direction:column} .screen.on{display:flex}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:6px}
button{min-height:52px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:14px;font:600 18px system-ui;padding:10px 14px;text-align:left;cursor:pointer;width:100%}
button.primary{background:var(--teal);color:#fff;border-color:var(--teal)} button.sel{outline:3px solid var(--teal)} button.drop{color:var(--red)} button:disabled{opacity:.5}
button small{display:block;font:14px system-ui;color:var(--mute);font-weight:400} button.primary small{color:#dff5ec}
.ar{font-size:17px;color:var(--mute);direction:rtl;display:block} .card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px;margin:4px 0 12px}
.card .big{font-size:22px;font-weight:700} .card .en{color:var(--mute);font-size:15px;margin-top:4px} .words{font-size:13px;color:var(--mute);margin-top:8px}
input,textarea{width:100%;font:18px system-ui;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);color:var(--ink)}
.quit{margin-top:auto;padding-top:14px;font-size:14px;color:var(--mute)} .quit a{color:var(--mute);display:inline-block;padding:12px 4px;min-height:44px} .ok{color:var(--teal)} .err{color:var(--red)}
.saved{font-size:12px;color:var(--mute);min-height:16px;margin-top:6px}
.grp{font-size:13px;color:var(--mute);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em;font-weight:600} .grp span{font-weight:400}
.btns button.word{text-align:left;min-height:52px} .btns button.word b{display:block} .btns button.word small{display:block;white-space:normal}
</style></head><body><main>
<p class="who" id="who">Medi's app has 3 quick questions before today's lesson. Your choice always wins.</p>
<p class="prog" id="prog"></p>
<div id="root"><p class="sug">Loading…</p></div>
<p class="quit" id="quit"><a href="#" id="quitlink">Stop here</a> · everything is saved as you tap · under 3 minutes</p>
</main>
<script src="../js/config.js"></script>
<script>
const qs=new URLSearchParams(location.search), TOKEN=qs.get('t')||'';
const H={apikey:ANEES.anon,Authorization:'Bearer '+ANEES.anon,'Content-Type':'application/json','X-Anees-Token':TOKEN};
const api=(m,p,b,extra)=>fetch(ANEES.url+'/rest/v1/'+p,{method:m,headers:{...H,...(extra||{})},body:b?JSON.stringify(b):undefined});
const root=document.getElementById('root'), prog=document.getElementById('prog'), who=document.getElementById('who');
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
let link=null, answers={}, step=0, screens=[];
// Durable autosave: every tap is written to localStorage first (queue + answers, keyed by this link), then sent; a reload
// resumes at the first unanswered screen and re-sends anything still queued. Nothing is lost on a dropped network.
const QK='anees-amal-q-'+TOKEN, AK='anees-amal-a-'+TOKEN;
const LS=(k,v)=>{ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||'null'); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } };
let flushing=false, pendingDone=false;
async function flush(){ if(flushing) return; flushing=true;
  while(true){ const q=LS(QK)||[]; if(!q.length) break; const job=q[0]; let ok=false;
    try{ const r= job.kind==='rule' ? await api('POST','amal_rules',job.body,{Prefer:'return=minimal'}) : await api('PATCH','amal_links?token=eq.'+encodeURIComponent(TOKEN),job.body,{Prefer:'return=minimal'}); ok=r.ok||r.status===409; }catch(e){ ok=false; }
    if(!ok){ await new Promise(r=>setTimeout(r,2000)); continue; }
    const q2=LS(QK)||[]; LS(QK,q2.filter(x=>x.id!==job.id)); }
  flushing=false; if(pendingDone && !(LS(QK)||[]).length){ pendingDone=false; showDone(); } }
setInterval(()=>{ if((LS(QK)||[]).length) flush(); },3000); window.addEventListener('online',flush);
function push(kind,body){ const q=LS(QK)||[]; q.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),kind,body}); LS(QK,q); flush(); }
function rule(kind,word_key,payload){ push('rule',{token:TOKEN,source:'planner',lesson_date:link.lesson_date,kind,word_key,payload}); }
function save(done){ answers.updated=new Date().toISOString(); LS(AK,answers); const body={answers}; if(done) body.done_at=answers.updated; if(!link.opened_at) body.opened_at=answers.updated; push('link',body); }
function show(i){ step=i; answers.step=i; LS(AK,answers); const s=screens[i]; if(!s){ finish(); return; } prog.textContent=s.prog; root.innerHTML=s.html; s.wire&&s.wire(); window.scrollTo(0,0); }
function next(){ show(step+1); }
function showDone(){ prog.textContent='Done'; who.textContent='Thank you, Amal.'; root.innerHTML='<h1>All saved. Have a good lesson!</h1><p class="sug">Medi\'s app suggested; you decided. Nothing else to do.</p>'; document.getElementById('quit').style.display='none'; }
function finish(){ answers.done=true; save(true); prog.textContent='Saving…'; root.innerHTML='<h1>Saving your answers…</h1><p class="sug">One moment. If you are offline this finishes by itself when you are back online.</p>'; document.getElementById('quit').style.display='none';
  if(!(LS(QK)||[]).length) showDone(); else { pendingDone=true; flush(); } }
function btn(label,sub,cls,id){ return `<button id="${id}" class="${cls||''}">${esc(label)}${sub?`<small>${esc(sub)}</small>`:''}</button>`; }
function build(p){
  const S=[];
  const MENU=(p.topics&&p.topics.length>3)?p.topics:["Last week's lessons", 'Grammar', 'New verbs', 'New nouns', 'New adjectives', 'Common sayings', 'Review listening', 'Review conversation', 'Other topic'];
  S.push({prog:'1 of 3',html:`<h1>What is today's lesson about?</h1><p class="sug">Tap everything that applies, then Next.</p><div class="btns" id="b">
    ${MENU.map((t,i)=>btn(t,(i===0&&p.last_words)?('last time: '+p.last_words):(t==='Review listening'?'Amal speaks, Medi listens and translates':(t==='Review conversation'?'back-and-forth practice on the last lessons':'')),null,'t'+i)).join('')}</div>
    <div id="typebox" style="display:none;margin-top:10px"><input id="topic" placeholder="Which topic?" aria-label="other topic"></div>
    <button id="tnext" class="primary" style="margin-top:12px;display:none">Next</button><div class="saved" id="s1"></div>`,
    wire(){ const sel=new Set(); const nextBtn=document.getElementById('tnext');
      MENU.forEach((t,i)=>{ const b=document.getElementById('t'+i); b.onclick=()=>{ if(sel.has(t)) sel.delete(t); else sel.add(t); b.classList.toggle('sel',sel.has(t));
        if(t==='Other topic'){ document.getElementById('typebox').style.display=sel.has(t)?'block':'none'; if(sel.has(t)) document.getElementById('topic').focus(); }
        nextBtn.style.display=sel.size?'block':'none'; }; });
      nextBtn.onclick=()=>{ const typed=document.getElementById('topic').value.trim(); const topics=[...sel].filter(t=>t!=='Other topic').concat(typed?[typed]:[]); if(!topics.length) return;
        answers.topic=topics.join(' + '); answers.topics=topics; rule('topic',null,{topic:answers.topic,topics,typed:typed||null,source:'menu'}); save(); next(); }; }});
  S.push({prog:'2 of 3',html:`<h1>Any new words today?</h1><p class="sug">Optional. The app suggests you skip this unless you already know them.</p><div class="btns">
    ${btn('No new words','or I will decide during the lesson','primary','nw0')}${btn('Yes, I will type them','one per line',null,'nw1')}</div>
    <div id="nwbox" style="display:none;margin-top:10px"><textarea id="nw" rows="4" placeholder="Arabizi, one word per line" aria-label="new words"></textarea><button id="nwgo" class="primary" style="margin-top:8px">Next</button></div>`,
    wire(){ document.getElementById('nw0').onclick=()=>{answers.new_words=[]; rule('new_words',null,{words:[]}); save(); next();};
      document.getElementById('nw1').onclick=()=>{document.getElementById('nwbox').style.display='block';};
      document.getElementById('nwgo').onclick=()=>{const ws=document.getElementById('nw').value.split(/\n/).map(x=>x.trim()).filter(Boolean); answers.new_words=ws; rule('new_words',null,{words:ws}); save(); next();}; }});
  const rep=p.repeat||[], menu=p.menu||null, PAGE=p.menu_page||8, GROUPS=[['verbs','Verbs'],['nouns','Nouns'],['adjectives','Adjectives'],['sayings','Sayings']];
  const pool=menu?Object.fromEntries(GROUPS.map(([g])=>[g,(menu[g]||[])])):{nouns:rep.slice(0,3)};
  const byKey={}; Object.values(pool).flat().forEach(w=>byKey[w.key]=w);
  const wordBtn=(w,sel)=>`<button data-k="${esc(w.key)}" class="word${sel.has(w.key)?' sel':''}"><b>${esc(w.arabizi)}</b><small>${esc(w.arabic||'')}  ·  ${esc(w.english||'')}${w.why?'  ·  <i>'+esc(w.why)+'</i>':''}</small></button>`;
  S.push({prog:'3 of 3',html:`<h1>Words for today</h1><p class="sug">${menu?'Some Medi got wrong, some he has not heard in a long time. Tap the ones you want to use today. "Show other words" brings the next set; your taps stay.':'The app suggests these words Medi missed. Tap the ones you want, then Next.'}</p>
    <div id="groups"></div>
    <div class="btns" style="margin-top:10px">${menu?'<button id="more">Show other words ↻</button>':''}<button id="rgo" class="primary">Next</button></div><div class="saved" id="s3"></div>`,
    wire(){ const sel=new Set(answers.repeat||[]); let page=0;
      const render=()=>{ document.getElementById('groups').innerHTML=GROUPS.map(([g,label])=>{ const all=pool[g]||[]; if(!all.length) return ''; const start=(page*PAGE)%all.length; const show=all.slice(start,start+PAGE).concat(start+PAGE>all.length?all.slice(0,start+PAGE-all.length):[]);
          const picked=all.filter(w=>sel.has(w.key)&&!show.some(x=>x.key===w.key));   // keep picked words visible even when the page moves on
          return `<div class="grp">${label} <span>(${show.length} of ${all.length})</span></div><div class="btns">${picked.concat(show).map(w=>wordBtn(w,sel)).join('')}</div>`; }).join('');
        document.querySelectorAll('#groups button.word').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; if(sel.has(k)) sel.delete(k); else sel.add(k); b.classList.toggle('sel',sel.has(k)); answers.repeat=[...sel]; LS(AK,answers); document.getElementById('s3').textContent=sel.size?sel.size+' picked':''; });
        document.getElementById('s3').textContent=sel.size?sel.size+' picked':''; };
      render();
      const more=document.getElementById('more'); if(more) more.onclick=()=>{ page++; render(); window.scrollTo(0,0); };
      document.getElementById('rgo').onclick=()=>{ answers.repeat=[...sel]; [...sel].forEach(k=>rule('repeat',k,{picked:true,arabizi:(byKey[k]||{}).arabizi})); if(!sel.size) rule('repeat',null,{none:true}); save(); next(); }; }});
  (p.sentences||[]).forEach((s,i)=>{ const n=p.sentences.length;
    S.push({prog:`Sentence ${i+1} of ${n}`,html:`<h1>Keep this sentence?</h1><p class="sug">One of ${n} suggestions for today (each uses a word Medi got wrong plus one he has not heard in a while). Keep, drop, or edit it.</p>
      <div class="card"><div class="big">${esc(s.arabizi)}</div><span class="ar">${esc(s.arabic||'')}</span><div class="en">${esc(s.english||'')}</div><div class="words">words: ${(s.words||[]).map(w=>esc(w.arabizi)).join(', ')}</div></div>
      <div class="btns">${btn('Keep','', 'primary','k'+i)}${btn('Drop','', 'drop','d'+i)}${btn('Edit','', null,'e'+i)}</div>
      <div id="ebox${i}" style="display:none;margin-top:10px"><input id="ev${i}" value="${esc(s.arabizi)}" aria-label="edited sentence"><button id="eg${i}" class="primary" style="margin-top:8px">Save my version</button></div>`,
      wire(){ const pl={arabizi:s.arabizi,arabic:s.arabic,english:s.english,keys:(s.words||[]).map(w=>w.key)};
        document.getElementById('k'+i).onclick=()=>{(answers.sentences=answers.sentences||{})[i]='keep'; rule('keep',null,pl); save(); next();};
        document.getElementById('d'+i).onclick=()=>{(answers.sentences=answers.sentences||{})[i]='drop'; rule('drop',null,pl); (s.words||[]).forEach(w=>rule('drop',w.key,{sentence:s.arabizi})); save(); next();};
        document.getElementById('e'+i).onclick=()=>{document.getElementById('ebox'+i).style.display='block';};
        document.getElementById('eg'+i).onclick=()=>{const v=document.getElementById('ev'+i).value.trim(); if(!v) return; (answers.sentences=answers.sentences||{})[i]='edit'; rule('edit',null,{...pl,edited:v}); save(); next();}; }});
  });
  return S;
}
document.getElementById('quitlink').onclick=e=>{e.preventDefault(); finish();};
(async()=>{
  if(!TOKEN){ root.innerHTML='<h1>This link is missing its code.</h1>'; return; }
  let rows=[]; try{ rows=await (await api('GET','amal_links?select=*&token=eq.'+encodeURIComponent(TOKEN))).json(); }catch(e){}
  link=Array.isArray(rows)?rows[0]:null;
  if(!link){ root.innerHTML='<h1>This link is not valid any more.</h1><p class="sug">Links work for 7 days. Ask Medi for a fresh one.</p>'; prog.textContent=''; return; }
  if(new Date(link.expires_at)<new Date()){ root.innerHTML='<h1>This link has expired.</h1><p class="sug">Links work for 7 days. Ask Medi for a fresh one.</p>'; prog.textContent=''; return; }
  if(link.done_at){ root.innerHTML='<h1>Already done, thank you Amal.</h1><p class="sug">Your answers are saved. Nothing else to do.</p>'; prog.textContent='Done'; document.getElementById('quit').style.display='none'; return; }
  answers=Object.assign({}, link.answers||{}, LS(AK)||{}); screens=build(link.payload||{});
  if(answers.done){ finish(); return; }
  show(typeof answers.step==='number' ? Math.min(answers.step, screens.length) : 0); flush(); save();
})();
</script><script src="../js/build.js"></script><script src="../js/stale.js"></script></body></html>
