<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anees · Word Bank audit</title><style>body{font:17px/1.6 system-ui;background:#f4f6f2;color:#18312e;margin:0}main{max-width:1050px;margin:auto;padding:24px}article{background:white;border:1px solid #d6ddd8;padding:16px;margin:12px 0;border-radius:12px}small{color:#52635c}input,select{font:inherit;padding:10px;max-width:100%;margin:5px 5px 5px 0}a{color:#0f6e56}.wrong{color:#b42332}button{padding:12px;font:inherit}#stats{padding:16px;background:#e5eee7;border-radius:12px}</style><main><a href="word-bank.html">← Word Bank</a><h1>Word Bank context audit</h1><p>Wrong-word substitutions mark both words wrong. Repeating a supplied correction earns no credit. Self-correction earns full credit with a note. Clarification questions do not penalize their question words. Red marks only a supported error.</p><p id="scope"></p><div id="stats">Loading…</div><input id="q" placeholder="Find a word, sentence, or date" aria-label="Search audit"><select id="status" aria-label="Audit status"><option value="">All outcomes</option><option>Correct</option><option>Wrong</option><option>Partial</option><option>Not scored</option><option>Needs review</option></select><label><input type="checkbox" id="changed">Changed entries only</label><section id="rows"></section><button id="more">Show more</button></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data,limit=50;function render(){const q=document.querySelector('#q').value.toLowerCase(),status=document.querySelector('#status').value,changed=document.querySelector('#changed').checked;const all=data.events.filter(e=>(!status||e.status===status)&&(!changed||e.changed)&&JSON.stringify(e).toLowerCase().includes(q));document.querySelector('#rows').innerHTML=all.slice(0,limit).map(e=>`<article><small>${esc(e.date)} · ${Math.floor(e.time/60)}:${String(Math.floor(e.time%60)).padStart(2,'0')} · ${esc(e.word||'Unassigned word')}</small><h3 class="${e.status==='Wrong'?'wrong':''}">${esc(e.status)}${e.changed?' · revised':''}</h3><p>${esc(e.sentence)}</p><p>${esc(e.reason)}</p>${e.audio?`<audio controls preload="none" src="${esc(e.audio)}"></audio>`:''}<p><a href="word-bank.html">Open Word Bank</a></p></article>`).join('');document.querySelector('#more').hidden=limit>=all.length;}for(const id of ['q','status','changed'])document.getElementById(id).oninput=()=>{limit=50;render();};document.querySelector('#more').onclick=()=>{limit+=50;render();};fetch('data/word-bank-audit.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{data=d;document.querySelector('#scope').textContent=d.scope;document.querySelector('#stats').textContent=Object.entries(d.counts).map(([k,v])=>`${v} ${k}`).join(' · ');render();});
</script></html>
